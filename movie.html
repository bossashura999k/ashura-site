<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player</title>
  </head>
  <body>

    <div class="player" id="player">
      <div class="playlist" id="playlist"></div>

      <div class="stage" id="stage">
        <video id="video" preload="metadata" tabindex="-1">
          <source id="videoSource" src="" type="video/mp4">
        </video>
        <div class="flash" id="flash"></div>
        <div class="buffering" id="buffering"><div class="spinner"></div></div>
      </div>

      <div class="controls">
        <div class="scrub" id="scrub">
          <div class="track">
            <div class="buffered" id="buffered"></div>
            <div class="fill" id="fill"></div>
          </div>
          <div class="knob" id="knob"></div>
        </div>

        <div class="row">
          <button class="ctl" id="playBtn" title="Play/Pause (space)"></button>
          <button class="ctl" id="skipBack" title="Back 10s (←)"></button>
          <button class="ctl" id="skipFwd" title="Forward 10s (→)"></button>

          <div class="vol">
            <button class="ctl" id="muteBtn" title="Mute (m)"></button>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
          </div>

          <div class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></div>

          <div class="spacer"></div>

          <div class="menu-wrap">
            <button class="ctl" id="speedBtn" title="Playback speed">1x</button>
            <div class="menu" id="speedMenu">
              <button data-speed="0.5">0.5x</button>
              <button data-speed="0.75">0.75x</button>
              <button data-speed="1" class="active">1x</button>
              <button data-speed="1.25">1.25x</button>
              <button data-speed="1.5">1.5x</button>
              <button data-speed="2">2x</button>
            </div>
          </div>

          <button class="ctl" id="pipBtn" title="Picture in picture"></button>
          <button class="ctl" id="fullBtn" title="Fullscreen (f)"></button>
        </div>
      </div>
    </div>


  </body>
</html>
