<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<style>
  :root{
    --bg: #101114;
    --surface: #17181d;
    --surface-2: #1e2027;
    --border: #2a2c34;
    --text: #e7e6e1;
    --text-dim: #8b8d97;
    --accent: #e0a940;
    --accent-dim: #7a6431;
    --radius: 3px;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .player{
    width: 100%;
    max-width: 960px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .stage{
    position: relative;
    background: #000;
    aspect-ratio: 16 / 9;
  }

  video{
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
  }

  video::cue{
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 1.05em;
    background: rgba(0,0,0,0.6);
    color: #f2f2ee;
  }

  /* center play/pause glyph shown briefly on toggle */
  .stage .flash{
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
  }
  .flash svg{
    width: 56px;
    height: 56px;
    filter: drop-shadow(0 2px 10px rgba(0,0,0,.6));
  }
  .flash.show{
    animation: flashpop .55s ease-out;
  }
  @keyframes flashpop{
    0%   { opacity: 0; transform: scale(0.8); }
    25%  { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }

  .stage .buffering{
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }
  .stage .buffering.show{ display: flex; }
  .spinner{
    width: 34px; height: 34px;
    border: 3px solid rgba(255,255,255,0.18);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* controls */
  .controls{
    background: var(--surface-2);
    padding: 10px 14px 12px;
    user-select: none;
  }

  .scrub{
    position: relative;
    height: 14px;
    display: flex;
    align-items: center;
    cursor: pointer;
    margin-bottom: 8px;
  }
  .scrub .track{
    position: relative;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .scrub .buffered{
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: rgba(255,255,255,0.14);
    width: 0%;
  }
  .scrub .fill{
    position: absolute;
    top: 0; left: 0; height: 100%;
    background: var(--accent);
    width: 0%;
  }
  .scrub .knob{
    position: absolute;
    top: 50%;
    width: 12px; height: 12px;
    background: var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    left: 0%;
    box-shadow: 0 0 0 3px rgba(224,169,64,0.18);
    opacity: 0;
    transition: opacity .15s;
  }
  .scrub:hover .knob{ opacity: 1; }

  .row{
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .row .spacer{ flex: 1; }

  button.ctl{
    background: none;
    border: none;
    color: var(--text);
    width: 32px; height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: var(--radius);
    padding: 0;
  }
  button.ctl:hover{ background: rgba(255,255,255,0.08); }
  button.ctl svg{ width: 18px; height: 18px; fill: var(--text); }
  button.ctl:hover svg{ fill: var(--accent); }
  button.ctl.active svg{ fill: var(--accent); }

  .time{
    font-family: "SFMono-Regular", Consolas, monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    white-space: nowrap;
    padding: 0 2px;
  }

  .vol{
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .vol input[type="range"]{
    width: 70px;
    accent-color: var(--accent);
  }

  .menu-wrap{ position: relative; }
  .menu{
    position: absolute;
    bottom: 40px;
    right: 0;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 4px;
    display: none;
    flex-direction: column;
    min-width: 92px;
    z-index: 5;
  }
  .menu.open{ display: flex; }
  .menu button{
    background: none;
    border: none;
    color: var(--text);
    font-size: 12px;
    text-align: left;
    padding: 6px 8px;
    border-radius: 2px;
    cursor: pointer;
    font-family: "SFMono-Regular", Consolas, monospace;
  }
  .menu button:hover{ background: rgba(255,255,255,0.08); }
  .menu button.active{ color: var(--accent); }

  input[type="range"]{
    -webkit-appearance: none;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height: 3px;
    background: var(--border);
    border-radius: 2px;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: -3.5px;
  }

  .meta{
    padding: 2px 2px 0;
    font-size: 11px;
    color: var(--text-dim);
    font-family: "SFMono-Regular", Consolas, monospace;
  }

  @media (prefers-reduced-motion: reduce){
    .flash.show, .spinner{ animation: none; }
  }
</style>
</head>
<body>

<div class="player" id="player">
  <div class="stage" id="stage">
    <video id="video" preload="metadata" tabindex="-1" crossorigin="anonymous">
      <source src="https://media.ashura.site/movie-web.mp4" type="video/mp4">
      <track id="track" kind="subtitles" src="Videos/subs.vtt" srclang="en" label="English">
    </video>
    <div class="flash" id="flash"></div>
    <div class="buffering" id="buffering"><div class="spinner"></div></div>
  </div>

  <div class="controls">
    <div class="scrub" id="scrub">
      <div class="track">
        <div class="buffered" id="buffered"></div>
        <div class="fill" id="fill"></div>
      </div>
      <div class="knob" id="knob"></div>
    </div>

    <div class="row">
      <button class="ctl" id="playBtn" title="Play/Pause (space)"></button>
      <button class="ctl" id="skipBack" title="Back 10s (←)"></button>
      <button class="ctl" id="skipFwd" title="Forward 10s (→)"></button>

      <div class="vol">
        <button class="ctl" id="muteBtn" title="Mute (m)"></button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
      </div>

      <div class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></div>

      <div class="spacer"></div>

      <div class="menu-wrap">
        <button class="ctl" id="speedBtn" title="Playback speed">1x</button>
        <div class="menu" id="speedMenu">
          <button data-speed="0.5">0.5x</button>
          <button data-speed="0.75">0.75x</button>
          <button data-speed="1" class="active">1x</button>
          <button data-speed="1.25">1.25x</button>
          <button data-speed="1.5">1.5x</button>
          <button data-speed="2">2x</button>
        </div>
      </div>

      <button class="ctl" id="capBtn" title="Subtitles (c)"></button>
      <button class="ctl" id="pipBtn" title="Picture in picture"></button>
      <button class="ctl" id="fullBtn" title="Fullscreen (f)"></button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const video = $('video'), stage = $('stage'), player = $('player');
  const playBtn = $('playBtn'), skipBack = $('skipBack'), skipFwd = $('skipFwd');
  const muteBtn = $('muteBtn'), volume = $('volume');
  const cur = $('cur'), dur = $('dur');
  const scrub = $('scrub'), fill = $('fill'), buffered = $('buffered'), knob = $('knob');
  const speedBtn = $('speedBtn'), speedMenu = $('speedMenu');
  const capBtn = $('capBtn'), pipBtn = $('pipBtn'), fullBtn = $('fullBtn');
  const flash = $('flash'), buffering = $('buffering');
  const track = $('track');

  const ICONS = {
    play:  '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause: '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
    back10:'<svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>',
    fwd10: '<svg viewBox="0 0 24 24"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/></svg>',
    volHi: '<svg viewBox="0 0 24 24"><path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>',
    volMute:'<svg viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>',
    cc:    '<svg viewBox="0 0 24 24"><path d="M19 4H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm-8.5 5.5H9c-.28 0-.5.22-.5.5v4c0 .28.22.5.5.5h1.5v1H9c-.83 0-1.5-.67-1.5-1.5v-4c0-.83.67-1.5 1.5-1.5h1.5v1zm7 0H16c-.28 0-.5.22-.5.5v4c0 .28.22.5.5.5h1.5v1H16c-.83 0-1.5-.67-1.5-1.5v-4c0-.83.67-1.5 1.5-1.5h1.5v1z"/></svg>',
    pip:   '<svg viewBox="0 0 24 24"><path d="M19 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2zm-8 8H6v-4h5v4z"/></svg>',
    fullOpen: '<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>',
    fullClose:'<svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>'
  };

  playBtn.innerHTML = ICONS.play;
  skipBack.innerHTML = ICONS.back10;
  skipFwd.innerHTML = ICONS.fwd10;
  muteBtn.innerHTML = ICONS.volHi;
  capBtn.innerHTML = ICONS.cc;
  pipBtn.innerHTML = ICONS.pip;
  fullBtn.innerHTML = ICONS.fullOpen;

  const fmt = s => {
    if (!isFinite(s)) return '0:00';
    s = Math.max(0, Math.floor(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
    const mm = h ? String(m).padStart(2, '0') : m;
    return (h ? h + ':' : '') + mm + ':' + String(sec).padStart(2, '0');
  };

  function flashIcon(name){
    flash.innerHTML = ICONS[name];
    flash.classList.remove('show');
    void flash.offsetWidth;
    flash.classList.add('show');
  }

  function togglePlay(){
    if (video.paused) { video.play(); } else { video.pause(); }
  }

  video.addEventListener('play', () => { playBtn.innerHTML = ICONS.pause; flashIcon('play'); });
  video.addEventListener('pause', () => { playBtn.innerHTML = ICONS.play; flashIcon('pause'); });
  playBtn.addEventListener('click', togglePlay);
  stage.addEventListener('click', e => { if (e.target === video || e.target === stage) togglePlay(); });

  skipBack.addEventListener('click', () => video.currentTime = Math.max(0, video.currentTime - 10));
  skipFwd.addEventListener('click', () => video.currentTime = Math.min(video.duration || 0, video.currentTime + 10));

  video.addEventListener('loadedmetadata', () => { dur.textContent = fmt(video.duration); });
  video.addEventListener('timeupdate', () => {
    cur.textContent = fmt(video.currentTime);
    const pct = (video.currentTime / (video.duration || 1)) * 100;
    fill.style.width = pct + '%';
    knob.style.left = pct + '%';
  });
  video.addEventListener('progress', () => {
    if (video.buffered.length) {
      const end = video.buffered.end(video.buffered.length - 1);
      buffered.style.width = ((end / (video.duration || 1)) * 100) + '%';
    }
  });
  video.addEventListener('waiting', () => buffering.classList.add('show'));
  video.addEventListener('playing', () => buffering.classList.remove('show'));
  video.addEventListener('canplay', () => buffering.classList.remove('show'));

  function seekTo(clientX){
    const rect = scrub.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
    video.currentTime = pct * (video.duration || 0);
  }
  let dragging = false;
  scrub.addEventListener('mousedown', e => { dragging = true; seekTo(e.clientX); });
  window.addEventListener('mousemove', e => { if (dragging) seekTo(e.clientX); });
  window.addEventListener('mouseup', () => dragging = false);
  scrub.addEventListener('touchstart', e => seekTo(e.touches[0].clientX));
  scrub.addEventListener('touchmove', e => seekTo(e.touches[0].clientX));

  volume.addEventListener('input', () => {
    video.volume = volume.value;
    video.muted = video.volume === 0;
    muteBtn.innerHTML = video.muted ? ICONS.volMute : ICONS.volHi;
  });
  muteBtn.addEventListener('click', () => {
    video.muted = !video.muted;
    muteBtn.innerHTML = video.muted ? ICONS.volMute : ICONS.volHi;
    if (!video.muted && video.volume === 0) { video.volume = 1; volume.value = 1; }
  });

  speedBtn.addEventListener('click', () => speedMenu.classList.toggle('open'));
  speedMenu.addEventListener('click', e => {
    const b = e.target.closest('button[data-speed]');
    if (!b) return;
    const rate = parseFloat(b.dataset.speed);
    video.playbackRate = rate;
    speedBtn.textContent = rate + 'x';
    [...speedMenu.children].forEach(c => c.classList.remove('active'));
    b.classList.add('active');
    speedMenu.classList.remove('open');
  });
  document.addEventListener('click', e => {
    if (!e.target.closest('.menu-wrap')) speedMenu.classList.remove('open');
  });

  function captionsOn(){ return track.track && track.track.mode === 'showing'; }
  capBtn.addEventListener('click', () => {
    if (!track.track) return;
    const on = captionsOn();
    track.track.mode = on ? 'hidden' : 'showing';
    capBtn.classList.toggle('active', !on);
  });

  pipBtn.addEventListener('click', async () => {
    try {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else await video.requestPictureInPicture();
    } catch (err) { console.warn('PiP unavailable:', err); }
  });

  fullBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) player.requestFullscreen();
    else document.exitFullscreen();
  });
  document.addEventListener('fullscreenchange', () => {
    fullBtn.innerHTML = document.fullscreenElement ? ICONS.fullClose : ICONS.fullOpen;
  });

  document.addEventListener('keydown', e => {
    if (!player.contains(document.activeElement) && document.activeElement !== document.body) return;
    switch (e.key) {
      case ' ': case 'k': e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': video.currentTime = Math.max(0, video.currentTime - 5); break;
      case 'ArrowRight': video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); break;
      case 'ArrowUp': e.preventDefault(); video.volume = Math.min(1, video.volume + 0.05); volume.value = video.volume; break;
      case 'ArrowDown': e.preventDefault(); video.volume = Math.max(0, video.volume - 0.05); volume.value = video.volume; break;
      case 'm': muteBtn.click(); break;
      case 'f': fullBtn.click(); break;
      case 'c': capBtn.click(); break;
    }
  });
})();
</script>
</body>
</html>
