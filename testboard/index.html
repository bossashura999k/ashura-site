<!DOCTYPE html>
<html lang="en">
<head>
        <meta http-equiv="Content-Security-Policy" content="
            default-src 'self';
            script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com;
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: https:;
            font-src 'self' data:;
            connect-src 'self' https://www.google-analytics.com https://analytics.google.com;
            frame-ancestors 'self';
            base-uri 'self';
            form-action 'self';
        ">
        <meta name="referrer" content="strict-origin-when-cross-origin">
        <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minimal Whiteboard</title>
    <link rel="stylesheet" href="/Styles/testboard.css">
</head>
<body>

    <!-- Drawing Surface -->
    <canvas id="whiteboard"></canvas>

    <!-- Controls Menu -->
    <div class="toolbar">
        <div class="color-palette">
            <div class="color-btn active" style="background: #000000;" data-color="#000000"></div>
            <div class="color-btn" style="background: #ff4757;" data-color="#ff4757"></div>
            <div class="color-btn" style="background: #2ed573;" data-color="#2ed573"></div>
            <div class="color-btn" style="background: #1e90ff;" data-color="#1e90ff"></div>
            <div class="color-btn" style="background: #ffa500;" data-color="#ffa500"></div>
        </div>
        <button class="clear-btn" id="clearBtn">Clear</button>
    </div>

    <script src="/testboard/script.js"></script>
</body>
</html>
