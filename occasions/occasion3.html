<html lang="en">

  ">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday 🎉</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/Styles/occ3.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZZWHMD2C8S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZZWHMD2C8S');
  </script>
</head>

<body>

<div class="card">
  <h1>🎂 Happy Birthday 🎂</h1>
  <p>The birthday legend</p>

  <!-- STATIC IMAGE (MUST BE INSIDE PROJECT ROOT) -->
  <img src="/Pics/file.png" alt="Birthday Legend">

  <button id="bdayBtn">🎉 Happy Birthday</button>
  <div id="message"></div>
</div>

<script>
  const btn = document.getElementById("bdayBtn");
  const msg = document.getElementById("message");

  btn.addEventListener("click", () => {
    msg.textContent = "🥳 Another year stronger. Another level unlocked.";
    launchConfetti();
    playBeep();
  });

  function launchConfetti() {
    for (let i = 0; i < 30; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.textContent = ["🎉", "🎂", "✨", "🥳"][Math.floor(Math.random() * 4)];
      c.style.left = Math.random() * 100 + "vw";
      c.style.animationDuration = (Math.random() * 2 + 2) + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  function playBeep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.frequency.value = 880;
    osc.connect(ctx.destination);
    osc.start();
    setTimeout(() => osc.stop(), 200);
  }
</script>

</body>
</html>
