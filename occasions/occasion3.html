<body>

<div class="card">
  <h1>🎂 Happy Birthday 🎂</h1>
  <p>The birthday legend</p>

  <!-- STATIC IMAGE (MUST BE INSIDE PROJECT ROOT) -->
  <img src="/Pics/file.png" alt="Birthday Legend">

  <button id="bdayBtn">🎉 Happy Birthday</button>
  <div id="message"></div>
</div>

<script>
  const btn = document.getElementById("bdayBtn");
  const msg = document.getElementById("message");

  btn.addEventListener("click", () => {
    msg.textContent = "🥳 Another year stronger. Another level unlocked.";
    launchConfetti();
    playBeep();
  });

  function launchConfetti() {
    for (let i = 0; i < 30; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.textContent = ["🎉", "🎂", "✨", "🥳"][Math.floor(Math.random() * 4)];
      c.style.left = Math.random() * 100 + "vw";
      c.style.animationDuration = (Math.random() * 2 + 2) + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 4000);
    }
  }

  function playBeep() {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    osc.frequency.value = 880;
    osc.connect(ctx.destination);
    osc.start();
    setTimeout(() => osc.stop(), 200);
  }
</script>

</body>
