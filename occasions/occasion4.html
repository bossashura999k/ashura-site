<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Occasion 4 — Flexisaf Internship</title>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZZWHMD2C8S"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { dataLayer.push(arguments); }
      gtag('js', new Date());
      gtag('config', 'G-ZZWHMD2C8S');
    </script>

    <style>
      :root {
        --bg-a: #081226;
        --bg-b: #06304a;
        --accent: #00d4ff;
      }

      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        margin: 0;
        font-family: Inter, Arial, sans-serif;
        background: linear-gradient(180deg, var(--bg-a), var(--bg-b));
        color: var(--accent);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 32px 20px;
      }

      .occasion-label {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--accent);
        opacity: 0.8;
        margin-bottom: 1rem;
      }

      .occasion-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 0.8s ease both;
      }

      .occasion-flier {
        width: 100%;
        max-width: 380px;
        border-radius: 16px;
        border: 1px solid rgba(0, 212, 255, 0.15);
        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
        object-fit: contain;
        transition: transform 0.18s ease, box-shadow 0.18s ease;
      }

      .occasion-flier:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 30px rgba(2, 6, 23, 0.6);
        border-color: rgba(0, 212, 255, 0.35);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to   { opacity: 1; transform: none; }
      }
    </style>
  </head>

  <body>
    <div class="occasion-item">
      <span class="occasion-label">Occasion 4</span>
      <img
        src="../Pics/Z.png"
        alt="Flexisaf Internship Program - Obire Oviemena Israel"
        class="occasion-flier"
      />
    </div>
  </body>
</html>
