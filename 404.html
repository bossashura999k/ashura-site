<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: https:;
        font-src 'self' data:;
        connect-src 'self' https://*.google-analytics.com https://www.google-analytics.com https://analytics.google.com;
        frame-ancestors 'self';
        base-uri 'self';
        form-action 'self';
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 – Page Not Found | Ashura IZZI</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        body { font-family: system-ui, sans-serif; text-align: center; padding: 4rem 1rem; }
    </style>
    <script>
        // Retry once with a lowercase path (e.g. /ChatBox/ -> /chatbox/).
        // Only the path is lowercased; query strings and #fragments are kept as-is.
        var path = window.location.pathname;
        if (path !== path.toLowerCase()) {
            window.location.replace(path.toLowerCase() + window.location.search + window.location.hash);
        }
    </script>
</head>
<body>
    <h1>404 – Page Not Found</h1>
    <p>Sorry, that page doesn't exist.</p>
    <p><a href="/">Back to the homepage</a></p>
</body>
</html>
