<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obire Israel | Backend &amp; Full-Stack Developer</title>
    <meta name="description" content="Detail-oriented Backend and Full-Stack Developer with enterprise-level backend engineering experience at FlexiSAF." />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind (used for utility classes) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ["Inter", "system-ui", "sans-serif"] },
                    colors: { primary: "#00d4ff", accent: "#a855f7" },
                    keyframes: {
                        blob: {
                            "0%,100%": { transform: "translate(0px,0px) scale(1)" },
                            "33%": { transform: "translate(22px,-14px) scale(1.05)" },
                            "66%": { transform: "translate(-18px,16px) scale(0.95)" }
                        }
                    },
                    animation: { blob: "blob 9s ease-in-out infinite" }
                }
            }
        };
    </script>

    <!-- External styles -->
    <link rel="stylesheet" href="/Styles/styles(index).css" />

    <!-- Google Analytics / TikTok Pixel (keep as is) -->
    <!-- ... -->

    <!-- JSON-LD Schema (keep as is) -->
</head>
<body>
    <!-- Background orbs -->
    <div class="export-bg-orb a"></div>
    <div class="export-bg-orb b"></div>

    <div class="export-content">
        <!-- Navigation -->
        <nav class="sticky top-3 z-50 px-3 sm:px-6">
            <div class="mx-auto flex max-w-6xl items-center justify-between rounded-2xl border border-zinc-800/90 bg-zinc-950/80 backdrop-blur-xl px-3 py-2.5 shadow-[0_24px_52px_-28px_rgba(0,0,0,0.6)]">
                <span class="text-sm font-semibold tracking-wide text-[#00d4ff]">Obire</span>

                <!-- Desktop nav -->
                <div class="hidden items-center gap-1 lg:flex text-zinc-400">
                    <a href="#hero" class="nav-link rounded-lg px-3 py-2 text-sm">Home</a>
                    <a href="#about" class="nav-link rounded-lg px-3 py-2 text-sm">About</a>
                    <a href="#skills" class="nav-link rounded-lg px-3 py-2 text-sm">Skills</a>
                    <a href="#projects" class="nav-link rounded-lg px-3 py-2 text-sm">Projects</a>
                    <a href="#experience" class="nav-link rounded-lg px-3 py-2 text-sm">Experience</a>
                    <!-- Resume button (opens modal) -->
                    <button type="button" id="resumeNavBtn" class="nav-link rounded-lg px-3 py-2 text-sm cursor-pointer hover:text-white transition">Resume</button>
                    <a href="#contact" class="nav-link rounded-lg px-3 py-2 text-sm">Contact</a>
                </div>

                <a href="#contact" class="hidden rounded-lg px-4 py-2 text-sm font-semibold lg:inline-flex text-[#0b1020] bg-gradient-to-r from-[#00d4ff] to-[#a855f7]">Start Project</a>

                <!-- Mobile menu -->
                <details class="relative z-[70] lg:hidden">
                    <summary class="list-none rounded-lg border border-zinc-800/90 bg-zinc-950/90 p-2 text-zinc-300 cursor-pointer">
                        <span class="flex items-center gap-2 text-xs font-medium">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-4 w-4"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>Menu
                        </span>
                    </summary>
                    <div class="absolute right-0 top-full mt-2 w-60 overflow-hidden rounded-xl border border-zinc-800/90 bg-zinc-950 p-2 shadow-[0_26px_56px_-24px_rgba(0,0,0,0.7)]">
                        <a href="#hero" class="block rounded-lg px-3 py-2.5 text-sm text-zinc-300 hover:text-white transition">Home</a>
                        <a href="#about" class="block rounded-lg px-3 py-2.5 text-sm text-zinc-300 hover:text-white transition">About</a>
                        <a href="#skills" class="block rounded-lg px-3 py-2.5 text-sm text-zinc-300 hover:text-white transition">Skills</a>
                        <a href="#projects" class="block rounded-lg px-3 py-2.5 text-sm text-zinc-300 hover:text-white transition">Projects</a>
                        <a href="#experience" class="block rounded-lg px-3 py-2.5 text-sm text-zinc-300 hover:text-white transition">Experience</a>
                        <button type="button" id="resumeMobileBtn" class="block w-full text-left rounded-lg px-3 py-2.5 text-sm text-zinc-300 hover:text-white transition">Resume</button>
                        <a href="#contact" class="block rounded-lg px-3 py-2.5 text-sm text-zinc-300 hover:text-white transition">Contact</a>
                    </div>
                </details>
            </div>
        </nav>

        <!-- ─── RESUME MODAL (added dynamically by JS) ─── -->
        <!-- The modal will be injected by script.js, but you can also include it statically -->

        <!-- Hero, About, Skills, Projects, Experience, Education, Contact, Footer -->
        <!-- (exactly the same sections as before, but without inline styles) -->

        <!-- Back to Top button -->
        <a href="#" class="back-to-top fixed bottom-6 right-6 w-12 h-12 rounded-full flex items-center justify-center text-white transition-all bg-gradient-to-r from-[#00d4ff] to-[#a855f7] shadow-[0_4px_15px_rgba(56,189,248,0.4)]" id="backToTop" aria-label="Back to top">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
        </a>
    </div>

    <!-- External script -->
    <script src="script.js"></script>
</body>
</html>
