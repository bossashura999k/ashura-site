<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://static.cloudflareinsights.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: https:;
      font-src 'self' data: https://fonts.gstatic.com;
      connect-src 'self' https://*.google-analytics.com https://www.google-analytics.com https://analytics.google.com https://cloudflareinsights.com;
      frame-ancestors 'self';
      base-uri 'self';
      form-action 'self';
    ">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta charset="UTF-8">
    <title>Ashura IZZI — ID Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="/Styles/idCard.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>


    <body>
    <div class="stage">
      <div class="zoom">
        <div class="card" id="card">
          <div class="stripe"></div>
          <div class="card-header">
            <div class="org">Identification<span>.</span></div>
            <div class="badge-label">Personal ID</div>
          </div>
          <div class="card-body">
            <div class="avatar"><img src="https://ashura.site/Pics/file.png" alt="Ashura Izzi"></div>
            <div class="id-info">
              <div class="name">Ashura IZZI</div>
              <div class="fullname">Obire Oviemena Israel</div>
              <div class="role-tag">backend.java.developer</div>
            </div>
          </div>
          <div class="card-footer">
            <div class="meta">
              <div class="meta-row">Job <b>Backend Java Intern</b></div>
              <div class="meta-row">Job Location <b>FlexiSAF, Abuja</b></div>
              <div class="meta-row">GitHub: <b>bossashura999k</b></div>
              <div class="meta-row">Phone NO: <b>07081472383</b></div>
              <div class="meta-row">Issued: <b>11 May 2026</b></div>
            </div>
            <div class="code-bars" id="bars"></div>
          </div>
        </div>
      </div>
      <div class="caption">Actual print size: 85.6mm x 54mm (standard CR80 card)</div>
    </div>

  <script>
    const bars = document.getElementById('bars');
    const heights = [1.6,3.6,2.4,4.8,2,4,2.8,5.2,1.8,3.2,4.4,2.2,3.8,5,2.6];
    heights.forEach(h=>{
      const d = document.createElement('div');
      d.style.height = h+'mm';
      bars.appendChild(d);
    });
  </script>
  </body>
</html>
