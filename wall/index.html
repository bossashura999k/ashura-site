<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
        <head>
                <meta http-equiv="Content-Security-Policy" content="
                    default-src 'self';
                    script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://wall-backend-piyo.onrender.com/messages https://www.google-analytics.com;
                    style-src 'self' 'unsafe-inline';
                    img-src 'self' data: https:;
                    font-src 'self' data:;
                    connect-src 'self' https://*.google-analytics.com https://wall-backend-piyo.onrender.com/messages https://www.google-analytics.com https://analytics.google.com;
                    frame-ancestors 'self';
                    base-uri 'self';
                    form-action 'self';
                ">
                <meta na`me="referrer" content="strict-origin-when-cross-origin">
                <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>The Wall</title>
    </head>
    <body style="background-image: url('https://ashura.site/Pics/kitten_cover.jpeg'); background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;">
        <div id="wall-chat" style="width:60%;max-width:700px;margin:40px auto;font-family:system-ui,sans-serif;border:1px solid #333;border-radius:10px;padding:16px;background:#111;color:#eee;">
            <h3 style="margin:0 0 12px;">The Wall</h3>

            <div id="wc-messages" style="max-height:300px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;"></div>

            <div style="display:flex;gap:6px;margin-bottom:6px;">
                <input id="wc-name" type="text" placeholder="Name (optional)" maxlength="30"
                style="flex:1;padding:6px;border-radius:6px;border:1px solid #444;background:#1a1a1a;color:#eee;">
            </div>
            <div style="display:flex;gap:6px;">
                <input id="wc-text" type="text" placeholder="Drop something..." maxlength="500"
                style="flex:1;padding:6px;border-radius:6px;border:1px solid #444;background:#1a1a1a;color:#eee;">
                <button id="wc-send" style="padding:6px 14px;border-radius:6px;border:none;background:#4f8cff;color:#fff;cursor:pointer;">Send</button>
            </div>
        </div>

        <script>
        (function () {
        const API_URL = "https://wall-backend-piyo.onrender.com"; // <-- change this after deploying

        const messagesEl = document.getElementById('wc-messages');
        const textEl = document.getElementById('wc-text');
        const nameEl = document.getElementById('wc-name');
        const sendBtn = document.getElementById('wc-send');

        function renderMessage(msg) {
            const div = document.createElement('div');
            div.style.padding = '6px 8px';
            div.style.background = '#1e1e1e';
            div.style.borderRadius = '6px';
            div.style.fontSize = '14px';

            const time = new Date(msg.timestamp).toLocaleString();
            div.innerHTML = `<strong style="color:#4f8cff;">${escapeHtml(msg.name)}</strong> ` +
            `<span style="color:#888;font-size:11px;">${time}</span><br>${escapeHtml(msg.text)}`;
            return div;
        }

        function escapeHtml(str) {
            const p = document.createElement('p');
            p.textContent = str;
            return p.innerHTML;
        }

        async function loadMessages() {
            try {
            const res = await fetch(`${API_URL}/messages`);
            const data = await res.json();
            messagesEl.innerHTML = '';
            data.forEach(msg => messagesEl.appendChild(renderMessage(msg)));
            messagesEl.scrollTop = messagesEl.scrollHeight;
            } catch (err) {
            messagesEl.innerHTML = '<span style="color:#f66;">Could not load messages.</span>';
            }
        }

        async function sendMessage() {
            const text = textEl.value.trim();
            if (!text) return;
            const name = nameEl.value.trim();

            sendBtn.disabled = true;
            try {
            await fetch(`${API_URL}/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, name }),
            });
            textEl.value = '';
            await loadMessages();
            } catch (err) {
            alert('Failed to send. Try again.');
            } finally {
            sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        textEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        loadMessages();
        setInterval(loadMessages, 5000); // poll every 5s so new posts show up for everyone
        })();
        </script>
    </body>
</html>
